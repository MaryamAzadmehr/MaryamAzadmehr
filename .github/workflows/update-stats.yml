name: Update GitHub Profile Stats

on:
  schedule:
    # Run every hour (0 minutes past every hour)
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-readme:
    name: Update Profile README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: MaryamAzadmehr
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README Timestamp
        run: |
          echo "<!-- Last Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC') -->" >> README.md
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update profile stats"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
